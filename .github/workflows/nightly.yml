name: Nightly

# Full run on main every night, independent of PRs, to catch drift and flakiness early.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  full:
    name: Full suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate ephemeral test credentials
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "APP_USER=ci-user" >> "$GITHUB_ENV"
          echo "APP_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Run all tests, repeated to expose flaky ones
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: |
          npx playwright test --repeat-each=3 --reporter=html,json
      - name: Summary
        if: ${{ !cancelled() }}
        run: node scripts/summary.mjs results.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  # Optional: publish the latest report to GitHub Pages.
  # Enable it by setting Pages source to "GitHub Actions" and the repository variable PUBLISH_REPORT=true.
  publish:
    name: Publish report to Pages
    needs: full
    if: ${{ !cancelled() && vars.PUBLISH_REPORT == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playwright-report
          path: report
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: report
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
