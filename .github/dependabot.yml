version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (npm ci fails with ERESOLVE). Revisit when it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
